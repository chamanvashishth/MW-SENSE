<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" role="img" aria-labelledby="title desc"><title id="title">ESP32 edge device flow</title><desc id="desc">The DHT22 temperature sensor is read by ESP32 firmware, queued in LittleFS, published over MQTT, and released when an acknowledgement matches.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a26"/><stop offset="1" stop-color="#17283a"/></linearGradient></defs><style>.bg{fill:url(#bg)}.h{fill:#edf4fa;font:600 19px system-ui}.hint{fill:#98acbf;font:12px system-ui}.n rect{fill:#1d3042;stroke:#39566f}.n text{fill:#f2f7fb;font:600 12px system-ui}.s{fill:#a7bacb;font:11px system-ui}.w{stroke:#65849f;stroke-width:2;stroke-dasharray:4 5}.p{fill:#6fd6bd;filter:drop-shadow(0 0 5px #6fd6bd)}</style><rect class="bg" width="880" height="270" rx="18"/><text class="h" x="24" y="38">The ESP32 at the edge</text><text class="hint" x="24" y="60">The current reference firmware reads temperature with a DHT22 adapter.</text><g class="n"><g><rect x="24" y="112" width="142" height="86" rx="12"/><text x="95" y="151" text-anchor="middle">DHT22</text><text class="s" x="95" y="171" text-anchor="middle">Temperature</text></g><g><rect x="196" y="112" width="142" height="86" rx="12"/><text x="267" y="151" text-anchor="middle">ESP32</text><text class="s" x="267" y="171" text-anchor="middle">Reads + timestamps</text></g><g><rect x="368" y="112" width="142" height="86" rx="12"/><text x="439" y="151" text-anchor="middle">LITTLEFS</text><text class="s" x="439" y="171" text-anchor="middle">Queues</text></g><g><rect x="540" y="112" width="142" height="86" rx="12"/><text x="611" y="151" text-anchor="middle">MQTT</text><text class="s" x="611" y="171" text-anchor="middle">Publishes</text></g><g><rect x="712" y="112" width="142" height="86" rx="12"/><text x="783" y="151" text-anchor="middle">ACK</text><text class="s" x="783" y="171" text-anchor="middle">Releases item</text></g></g><g class="w"><path d="M166 155H196M338 155H368M510 155H540M682 155H712"/></g><circle class="p" r="5"><animateMotion dur="7s" repeatCount="indefinite" path="M166 155H712"/></circle><text class="hint" x="24" y="238">Reference firmware · physical board and sensor validation are separate work</text></svg>