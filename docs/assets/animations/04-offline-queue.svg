<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" role="img" aria-labelledby="title desc"><title id="title">Offline queue and acknowledgement</title><desc id="desc">A sample is held in the local queue during a connection outage and removed after the backend sends a matching acknowledgement.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a26"/><stop offset="1" stop-color="#17283a"/></linearGradient></defs><style>.bg{fill:url(#bg)}.h{fill:#edf4fa;font:600 19px system-ui}.hint{fill:#98acbf;font:12px system-ui}.n rect{fill:#1d3042;stroke:#39566f}.n text{fill:#f2f7fb;font:600 12px system-ui}.s{fill:#a7bacb;font:11px system-ui}.w{stroke:#65849f;stroke-width:2;stroke-dasharray:4 5}.p{fill:#ffca73;filter:drop-shadow(0 0 5px #ffca73)}</style><rect class="bg" width="880" height="270" rx="18"/><text class="h" x="24" y="38">When the network goes offline</text><text class="hint" x="24" y="60">Pending readings stay in a bounded queue until the backend confirms them.</text><g class="n"><g><rect x="24" y="112" width="142" height="86" rx="12"/><text x="95" y="151" text-anchor="middle">SENSOR</text><text class="s" x="95" y="171" text-anchor="middle">Creates sample</text></g><g><rect x="196" y="112" width="142" height="86" rx="12"/><text x="267" y="151" text-anchor="middle">QUEUE</text><text class="s" x="267" y="171" text-anchor="middle">Stores locally</text></g><g><rect x="368" y="112" width="142" height="86" rx="12"/><text x="439" y="151" text-anchor="middle">BROKER</text><text class="s" x="439" y="171" text-anchor="middle">Link returns</text></g><g><rect x="540" y="112" width="142" height="86" rx="12"/><text x="611" y="151" text-anchor="middle">BACKEND</text><text class="s" x="611" y="171" text-anchor="middle">Stores once</text></g><g><rect x="712" y="112" width="142" height="86" rx="12"/><text x="783" y="151" text-anchor="middle">ACK</text><text class="s" x="783" y="171" text-anchor="middle">Confirms ID</text></g></g><g class="w"><path d="M166 155H196M338 155H368M510 155H540M682 155H712"/></g><circle class="p" r="5"><animateMotion dur="7s" repeatCount="indefinite" path="M166 155H712"/></circle><text class="hint" x="24" y="238">At-least-once retry with idempotent ingestion · not exactly-once delivery</text></svg>