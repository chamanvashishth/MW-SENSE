<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 270" role="img" aria-labelledby="title desc"><title id="title">MQTT publish and subscribe</title><desc id="desc">An MQTT publisher sends a message to a broker which forwards it to a subscriber.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a26"/><stop offset="1" stop-color="#17283a"/></linearGradient></defs><style>.bg{fill:url(#bg)}.h{fill:#edf4fa;font:600 19px system-ui}.hint{fill:#98acbf;font:12px system-ui}.n rect{fill:#1d3042;stroke:#39566f}.n text{fill:#f2f7fb;font:600 13px system-ui}.s{fill:#a7bacb;font:11px system-ui}.w{stroke:#65849f;stroke-width:2;stroke-dasharray:5 5}.p{fill:#d4a6ff;filter:drop-shadow(0 0 5px #d4a6ff)}</style><rect class="bg" width="880" height="270" rx="18"/><text class="h" x="24" y="38">MQTT: publish / subscribe</text><text class="hint" x="24" y="60">A publisher sends to a broker; subscribers receive matching topics.</text><g class="n"><rect x="55" y="112" width="190" height="86" rx="12"/><text x="150" y="151" text-anchor="middle">PUBLISHER</text><text class="s" x="150" y="171" text-anchor="middle">ESP32 node</text><rect x="345" y="112" width="190" height="86" rx="12"/><text x="440" y="151" text-anchor="middle">BROKER</text><text class="s" x="440" y="171" text-anchor="middle">Routes topic</text><rect x="635" y="112" width="190" height="86" rx="12"/><text x="730" y="151" text-anchor="middle">SUBSCRIBER</text><text class="s" x="730" y="171" text-anchor="middle">Bridge service</text></g><path class="w" d="M245 155H345M535 155H635"/><circle class="p" r="6"><animateMotion dur="3.2s" repeatCount="indefinite" path="M245 155H635"/></circle><text class="hint" x="24" y="238">The broker distributes messages based on topic subscriptions</text></svg>